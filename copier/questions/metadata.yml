vl_owner_surname:
    type: str
    help: What is the surname of the virtual lab owner?

vl_owner_forename:
    type: str
    help: What is the forename of the virtual lab owner?

vl_owner_email:
    type: str
    help: What is the email of the virtual lab owner?

vl_owner_orcid:
    type: str
    help: What is the ORCID of the virtual lab owner?

vl_name:
    type: str
    help: What name would you like for your virtual lab?

vl_abbreviation:
    type: str
    help: What abbreviation would you like for your virtual lab?

vl_description:
    type: str
    help: Provide a short description of the scientific objective or research question for which you consider using a virtual research environment.

vl_image:
    type: str
    help: Provide a github URL to an image that represents your virtual lab.
    default: "https://github.com/NaaVRE/naavre.github.io/blob/main/static/img/logo-normal-light.svg"

vl_keywords:
    type: str
    help: Provide a list of comma separated keywords that describe your virtual lab (; separated).
    default: "keyword1; keyword2; keyword3"

tutorial_available:
    type: bool
    help: A tutorial is available for the virtual lab in documentation/tutorial.ipynb.
    default: no
    when: "{{ maturity_level_2 }}"

publications:
    type: str
    help: Publications relevant to this virtual lab (; separated).
    default: Author, A. Title of work. Journal Name, year, (DOI); Author, B. Title of work. Journal Name, year, (DOI)

algorithms:
    type: str
    help: Algorithms relevant to this virtual lab (; separated).
    default: Algorithm 1; Algorithm 2; Algorithm 3